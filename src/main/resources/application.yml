spring:
  application.name: MIllionLikes
  mvc:
    servlet:
#      http://localhost:8181/api/doc.html#/home api文档地址
      path: /api
    # DataSource Config
  datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/hundred_million_likes?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      username: root
      password:

  # mybatis-plus
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000

server:
  port: 8181
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    com.xuanjia.millionlikes.mapper: debug